services:
  coach-ia:
    build: .
    ports:
      - "3001:3000"
    volumes:
      - ./prisma/dev.db:/app/prisma/dev.db
    env_file:
      - .env
      - .env.local
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=https://coachia.jmlabs.app
    restart: unless-stopped
    networks:
      - inmich_net

networks:
  inmich_net:
    external: true
