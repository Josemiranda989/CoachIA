services:
  coach-ia:
    build: .
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "3001:3000"
    volumes:
      - ./prisma/dev.db:/app/prisma/dev.db
    env_file:
      - .env
      - .env.local
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=https://coachia.jmlabs.app
      - TZ=America/Argentina/Tucuman
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - inmich_net

networks:
  inmich_net:
    external: true
